<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TZKO.dev</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Inter", sans-serif;
    }

    body {
      position: relative;
      background:
        radial-gradient(circle at 78% 12%,
          rgba(168, 85, 247, 1) 0%,
          rgba(139, 92, 246, 0.85) 14%,
          rgba(109, 40, 217, 0.55) 30%,
          rgba(76, 29, 149, 0.28) 48%,
          rgba(0, 0, 0, 0) 70%),
        #000;
    }

    /* Visible fine dots */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;

      background-image:
        radial-gradient(circle,
          rgba(255,255,255,0.55) 0.7px,
          transparent 0.95px);

      background-size: 6px 6px;
      opacity: 1;

      mask-image:
        radial-gradient(circle at 78% 12%,
          rgba(0,0,0,1) 0%,
          rgba(0,0,0,0.98) 18%,
          rgba(0,0,0,0.88) 36%,
          rgba(0,0,0,0.48) 62%,
          rgba(0,0,0,0.10) 84%,
          rgba(0,0,0,0) 100%);
      -webkit-mask-image:
        radial-gradient(circle at 78% 12%,
          rgba(0,0,0,1) 0%,
          rgba(0,0,0,0.98) 18%,
          rgba(0,0,0,0.88) 36%,
          rgba(0,0,0,0.48) 62%,
          rgba(0,0,0,0.10) 84%,
          rgba(0,0,0,0) 100%);
    }

    /* Soft vignette */
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at center,
          transparent 58%,
          rgba(0,0,0,0.35) 100%);
    }

    .hero {
      position: relative;
      z-index: 1;
      height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
      color: white;
      padding: 24px;
    }

    .hero-inner {
      max-width: 760px;
    }

    .line {
      width: 64px;
      height: 1px;
      background: rgba(255,255,255,0.18);
      margin: 0 auto 28px;
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 7vw, 86px);
      font-weight: 300;
      line-height: 1.04;
      letter-spacing: -0.045em;
    }

    p {
      margin: 22px auto 34px;
      max-width: 560px;
      color: #bdbdbd;
      font-size: clamp(16px, 2vw, 21px);
      line-height: 1.55;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      border-radius: 999px;
      background: #fff;
      color: #000;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: transform .15s ease, opacity .15s ease;
    }

    .button:hover {
      transform: translateY(-1px);
      opacity: .96;
    }

    .footer {
      margin-top: 26px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="hero-inner">
      <div class="line"></div>

      <h1>Creating experiences for the masses.</h1>

      <p>
        With quality in mind, we specialise in Minecraft server creation.
      </p>

      <a class="button" href="https://discord.gg/YOURINVITE" target="_blank" rel="noreferrer">
        Join Discord
      </a>

      <div class="footer">
        © 2026 TZKO.dev
      </div>
    </div>
  </div>
</body>
</html>
